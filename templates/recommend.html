<!DOCTYPE html>
<html>
<head>
    <title>AI Donor Recommendation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

    body {
        background-color: #f8f9fa;
    }

    .card {
       border-radius: 20px;
       box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
    }

    .card:hover {
       transform: translateY(-5px);
       transition: 0.3s;
    }

    </style>

</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-danger">

    <div class="container mt-5">

        <h3 class="text-white">
            🤖 AI Recommendation System
        </h3>

        <a href="/" class="btn btn-light">
            Home
        </a>

    </div>

</nav>

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">
<h3>🤖 AI Donor Recommendation</h3>
</div>

<div class="card-body">

<form action="/ai_search" method="POST">

<div class="mb-3">

<label>Blood Group</label>

<select name="blood_group" class="form-select" required>

<option value="">Select</option>

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

</div>

<div class="mb-3">

<label>City</label>

<input
type="text"
name="city"
class="form-control"
placeholder="Enter City"
required>

</div>

<button class="btn btn-danger w-100" type="submit">
    🤖 Get AI Recommendation
</button>

</form>

{% if donor %}

<hr>

<h4 class="text-success">🏆 Best Recommended Donor</h4>

<table class="table table-bordered">

<tr>
<th>Name</th>
<td>{{ donor.donor_name }}</td>
</tr>

<tr>
<th>Blood Group</th>
<td>{{ donor.blood_group }}</td>
</tr>

<tr>
<th>City</th>
<td>{{ donor.city }}</td>
</tr>

<tr>
<th>Mobile</th>
<td>{{ donor.mobile }}</td>
</tr>

<tr>
<th>Last Donation</th>
<td>{{ donor.last_donation }}</td>
</tr>

</table>

{% endif %}

</div>

</div>

</div>

</body>
</html>
