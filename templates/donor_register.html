<!DOCTYPE html>
<html>
<head>
    <title>Donor Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-danger text-white">
<h3>🩸 Blood Donor Registration</h3>
</div>

<div class="card-body">

<form action="/donor_register" method="POST">

<input class="form-control mb-3" type="text" name="donor_name" placeholder="Donor Name" required>

<input class="form-control mb-3" type="number" name="age" placeholder="Age" required>

<select class="form-select mb-3" name="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<select class="form-select mb-3" name="blood_group" required>
<option value="">Select Blood Group</option>
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>
</select>

<input class="form-control mb-3" type="text" name="mobile" placeholder="Mobile Number" required>

<input class="form-control mb-3" type="text" name="city" placeholder="City" required>

<input class="form-control mb-3"
       type="text"
       name="location"
       placeholder="Google Maps location link">

<label>Last Donation Date</label>

<input class="form-control mb-3"
       type="date"
       name="last_donation">

<button class="btn btn-danger w-100" type="submit">
Register Donor
</button>

</form>

</div>

</div>

</div>

</body>
</html>
